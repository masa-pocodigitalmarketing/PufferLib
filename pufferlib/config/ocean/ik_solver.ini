[base]
package = ocean
env_name = puffer_ik_solver
policy_name = IKSolverPolicy
rnn_name = Recurrent

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[vec]
num_envs = 8

[env]
num_envs = 256
max_steps = 64
reward_ee_weight = 1.0
reward_com_weight = 0.5
reward_pose_weight = 0.1
reward_smoothness_weight = 0.01
action_scale = 0.1

[train]
total_timesteps = 100_000_000
gamma = 0.99
learning_rate = 0.0003
minibatch_size = 4096
batch_size = auto
bptt_horizon = 16
clip_coef = 0.2
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5
update_epochs = 4
anneal_lr = true
checkpoint_interval = 100

[sweep]
method = Protein
metric = score

[sweep.train.learning_rate]
distribution = log_normal
min = 1e-5
max = 1e-2
mean = 3e-4
scale = 0.5

[sweep.train.gamma]
distribution = linear
min = 0.95
max = 0.999

[sweep.env.action_scale]
distribution = log_normal
min = 0.01
max = 0.5
mean = 0.1
scale = 0.5
